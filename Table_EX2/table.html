<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Table Exercise 2</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <table>
    <tr class="first-row">
        <td class="first-row-cell1">Column aligned to left</td>
        <td class="first-row-cell2">Column 2 centered</td>
        <td class="first-row-cell3">Column 3 aligned to the right</td>
    </tr>
    <tr class="second-row">
        <td class="second-row-cell1">Cell 1 aligned to the top left</td>
        <td class="second-row-cell2">Cell 2 centered and in the middle</td>
        <td class="second-row-cell3">Cell 3 aligned to the bottom right</td>
    </tr>
    <tr class="third-row">
        <td class="third-row-cell3">Cell 3 aligned at the top</td>
        <td class="third-row-cell4">Cell 4 aligned at the top</td>
        <td class="third-row-cell5"></td>
    </tr>
    <tr class="fourth-row">
        <td class="fourth-row-cell1">Cell 1</td>
        <td class="fourth-row-cell2" colspan="2">Cell 2 merged</td>
    </tr>
    <tr class="fifth-row">
        <td class="fifth-row-cell2">Cell 2</td>
        <td class="fifth-row-cell3">Cell 3</td>
        <td class="fifth-row-cell2" rowspan="2">2 cells merged</td>
    </tr>  
    <tr class="sixth-row">
        <td class="sixth-row-cell4">Cell 4</td>
        <td class="sixth-row-cell5">Cell 5</td>
    </tr>
    <tr class="seventh-row">
        <td class="seventh-row-cell4" colspan="3">Cell 4</td>
    </tr>
</table>
    </body>
</html>
