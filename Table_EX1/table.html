<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table style="width: 200px;">
        <tr class="first_table">
            <td>X</td>
            <td colspan="3">Font=Arial</td>
            <td>X</td>
        </tr>

        <tr class="second_table">
            <td></td>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td></td>
        </tr>

        <tr class="third_table">
            <td></td>
            <td>4</td>
            <td>5</td>
            <td >6</td>
            <td></td>
        </tr>

        <tr class="fourth_table">
            <td></td>
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td></td>
        </tr>

        <tr class="fifth_table">
            <td>X</td>
            <td colspan="3">Merged cells</td>
            <td>X</td>
        </tr>
    </table>
</body>
</html>
